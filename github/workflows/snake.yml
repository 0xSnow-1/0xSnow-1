name: Generate Snow Snake

on:
  schedule:
    - cron: "0 0 * * *"   # regenerates daily
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate icy-themed contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%238ED1FC&color_dots=%23e6f4ff,%23bfe3ff,%2390cdf4,%2360a5e8,%233c7dd9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23a8e0ff

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
